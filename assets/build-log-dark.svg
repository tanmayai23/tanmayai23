<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Build log: explore the work, read the code, test the claims, improve the system."><title>Build log: explore the work, read the code, test the claims, improve the system.</title><style>
  .sans { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
  .cond { font-family: Bahnschrift, 'DIN Condensed', 'Arial Narrow', 'Roboto Condensed', 'Segoe UI', sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Consolas, 'Courier New', monospace; }
  .serif { font-family: Georgia, 'Times New Roman', serif; }
  .rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
  .redact { animation: unredact .7s cubic-bezier(.7,0,.3,1) both; transform-box: fill-box; transform-origin: right; }
  .stamp { animation: stamp .5s cubic-bezier(.2,.8,.2,1.3) both; transform-box: fill-box; transform-origin: center; }
  .blink { animation: blink 1.2s steps(1) infinite; }
  .ping { animation: ping 2s cubic-bezier(0,0,.2,1) infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes unredact { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  @keyframes stamp { from { opacity: 0; transform: scale(1.8); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes ping { 0% { opacity: .8; transform: scale(1); } 80%,100% { opacity: 0; transform: scale(2.8); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .redact { display: none; } }

  .signal { animation: travel 5s cubic-bezier(.6,0,.4,1) infinite; }
  @keyframes travel { 0% { transform: translateX(0); opacity: 0; } 6% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translateX(900px); opacity: 0; } }
  .lit { animation: lit 5s linear infinite; }
  @keyframes lit { 0%,100% { fill: #11161F; } 4%,14% { fill: #D2404F; } 22% { fill: #11161F; } }
</style><defs><clipPath id="sheet"><rect width="1200" height="230" rx="14"/></clipPath><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ECE9E2" stroke-opacity=".05"/></pattern></defs>

<g clip-path="url(#sheet)">
  <rect width="1200" height="230" fill="#0B0E14"/>
  <rect width="1200" height="230" fill="url(#grid)"/>
</g>
