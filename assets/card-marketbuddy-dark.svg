<svg xmlns="http://www.w3.org/2000/svg" width="492" height="156" viewBox="0 0 492 156" role="img" aria-label="Market Buddy">
<title>Market Buddy</title><style>
  .sans { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Consolas, 'Courier New', monospace; }
  .pop { animation: pop .45s cubic-bezier(.2,.8,.2,1.2) both; transform-box: fill-box; }
  .popL { transform-origin: left bottom; }
  .popR { transform-origin: right bottom; }
  .typing { opacity: 0; animation: show .7s linear; }
  .dot { animation: bounce 1s ease-in-out infinite; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  .twinkle { animation: twinkle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.94); } to { opacity: 1; transform: none; } }
  @keyframes show { 0%,100% { opacity: 1; } }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-5px); opacity: 1; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes twinkle { 0%,100% { opacity: .2; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.1); } }
  @media (prefers-reduced-motion: reduce) { .pop, .dot, .blink, .twinkle { animation: none !important; } }

  .shine { animation: shine 8s ease-in-out 2.4s infinite; }
  @keyframes shine { 0% { transform: translateX(-160px) skewX(-20deg); } 30%,100% { transform: translateX(700px) skewX(-20deg); } }
</style>
<defs>
  <clipPath id="c"><rect width="492" height="156" rx="18"/></clipPath>
  <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#FBBF24" stop-opacity=".65"/></linearGradient>
  <radialGradient id="gl" cx="1" cy="0" r="1"><stop offset="0" stop-color="#FBBF24" stop-opacity=".18"/><stop offset=".7" stop-color="#FBBF24" stop-opacity="0"/></radialGradient>
  <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#FBBF24" stop-opacity="0"/><stop offset=".5" stop-color="#FBBF24" stop-opacity=".08"/><stop offset="1" stop-color="#FBBF24" stop-opacity="0"/></linearGradient>
</defs>
<g clip-path="url(#c)">
  <rect width="492" height="156" fill="#161B22"/>
  <rect width="492" height="156" fill="url(#gl)"/>
  <rect width="100" height="156" fill="url(#sh)" class="shine"/>
  <rect width="4" height="156" fill="#FBBF24"/>
</g>
<rect x=".5" y=".5" width="491" height="155" rx="17.5" fill="none" stroke="#30363D"/>
<g class="pop popL">
  <rect x="24" y="24" width="54" height="54" rx="14" fill="url(#ic)"/>
  <text x="51" y="58" text-anchor="middle" class="sans" font-size="20" font-weight="800" fill="#0D1117">MB</text>
  <text x="94" y="48" class="sans" font-size="22" font-weight="800" letter-spacing="-.5" fill="#E6EDF3">Market Buddy</text>
  <text x="94" y="70" class="mono" font-size="12.5" fill="#8B949E">Next.js · LangGraph · CALL-E</text>
  <text x="468" y="50" text-anchor="end" class="sans" font-size="27" font-weight="800" letter-spacing="-1" fill="#FBBF24">421</text>
  <text x="468" y="70" text-anchor="end" class="sans" font-size="12.5" fill="#8B949E">tests passing</text>
  <line x1="24" y1="98" x2="468" y2="98" stroke="#30363D"/>
  <text x="24" y="128" class="sans" font-size="15.5" fill="#C9D1D9">Voice agent that turns supplier calls into deals</text>
  <text x="468" y="129" text-anchor="end" class="mono" font-size="17" font-weight="700" fill="#FBBF24">↗</text>
</g>
</svg>
