<svg xmlns="http://www.w3.org/2000/svg" width="592" height="220" viewBox="0 0 592 220" role="img" aria-label="Market Buddy">
<title>Market Buddy</title>
<style>
  .sans { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Consolas, 'Courier New', monospace; }
  .rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  .ping { animation: ping 2s cubic-bezier(0,0,.2,1) infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes ping { 0% { opacity: .8; transform: scale(1); } 80%,100% { opacity: 0; transform: scale(2.8); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .shine { animation: shine 8s ease-in-out 2.6s infinite; }
  @keyframes shine { 0% { transform: translateX(-200px) skewX(-20deg); } 30%,100% { transform: translateX(800px) skewX(-20deg); } }
</style>
<defs>
  <clipPath id="c"><rect width="592" height="220" rx="20"/></clipPath>
  <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#FBBF24" stop-opacity=".20"/><stop offset=".7" stop-color="#FBBF24" stop-opacity="0"/></radialGradient>
  <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#FBBF24" stop-opacity="0"/><stop offset=".5" stop-color="#FBBF24" stop-opacity=".07"/><stop offset="1" stop-color="#FBBF24" stop-opacity="0"/></linearGradient>
</defs>

<g clip-path="url(#c)">
  <rect width="592" height="220" fill="#161B22"/>
  <rect width="592" height="220" fill="url(#glow)"/>
  <rect width="120" height="220" fill="url(#sh)" class="shine"/>
</g>
<rect x=".5" y=".5" width="591" height="219" rx="19.5" fill="none" stroke="#30363D"/>
<g class="rise">
  <circle cx="32" cy="38" r="4" fill="#FBBF24"/><text x="44" y="42" class="mono" font-size="12" font-weight="600" letter-spacing="2.2" fill="#8B949E">AGENTIC AI</text>
  <text x="26" y="96" class="sans" font-size="32" font-weight="800" letter-spacing="-1" fill="#E6EDF3">Market Buddy</text>
  <text x="28" y="130" class="sans" font-size="15" fill="#8B949E">Voice agent that turns supplier calls into commitments</text>
  <text x="564" y="72" text-anchor="end" class="sans" font-size="38" font-weight="800" letter-spacing="-1.5" fill="#FBBF24">421</text>
  <text x="564" y="94" text-anchor="end" class="sans" font-size="13" fill="#8B949E">tests passing</text>
</g>
<g class="rise" style="animation-delay:0.20s"><rect x="28.0" y="166" width="74.4" height="28" rx="14.0" fill="#FBBF24" fill-opacity=".10" stroke="#FBBF24" stroke-opacity=".35"/><text x="65.2" y="184.3" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#FBBF24">Next.js</text><rect x="110.4" y="166" width="88.8" height="28" rx="14.0" fill="#FBBF24" fill-opacity=".10" stroke="#FBBF24" stroke-opacity=".35"/><text x="154.8" y="184.3" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#FBBF24">LangGraph</text><rect x="207.2" y="166" width="67.2" height="28" rx="14.0" fill="#FBBF24" fill-opacity=".10" stroke="#FBBF24" stroke-opacity=".35"/><text x="240.8" y="184.3" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#FBBF24">CALL-E</text><rect x="282.4" y="166" width="96.0" height="28" rx="14.0" fill="#FBBF24" fill-opacity=".10" stroke="#FBBF24" stroke-opacity=".35"/><text x="330.4" y="184.3" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#FBBF24">TypeScript</text>
  <text x="564" y="186" text-anchor="end" class="mono" font-size="18" fill="#FBBF24">↗</text>
</g>

</svg>
