<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="SwachhVan — AI smart-sanitation platform, Top 25 of 400+ teams"><title>SwachhVan — AI smart-sanitation platform, Top 25 of 400+ teams</title><style>
  .sans { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
