<svg xmlns="http://www.w3.org/2000/svg" width="580" height="260" viewBox="0 0 580 260" role="img" aria-label="Hey Dude">
<title>Hey Dude</title>
<style>
  .sans { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace; }
  .rise { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
  .fade { animation: fade .6s ease-out both; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .ping { animation: ping 2s cubic-bezier(0,0,.2,1) infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 0%,100% { opacity: .45; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }
  @keyframes ping { 0% { opacity: .7; transform: scale(1); } 80%,100% { opacity: 0; transform: scale(2.6); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .shine { animation: shine 7s ease-in-out 1.1s infinite; }
  @keyframes shine { 0% { transform: translateX(-260px) skewX(-20deg); } 35%,100% { transform: translateX(860px) skewX(-20deg); } }
</style>
<defs>
  <clipPath id="c"><rect width="580" height="260" rx="16"/></clipPath>
  <linearGradient id="top" x1="0" x2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient>
  <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#A78BFA" stop-opacity=".14"/><stop offset=".6" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
</defs>

<g clip-path="url(#c)">
  <rect width="580" height="260" fill="#0C1220"/>
  <rect width="580" height="260" fill="url(#glow)"/>
  <rect width="580" height="3" fill="url(#top)"/>
  <rect x="0" y="0" width="140" height="260" fill="url(#sh)" class="shine"/>
</g>
<rect x=".5" y=".5" width="579" height="259" rx="15.5" fill="none" stroke="#1C2638"/>
<g class="rise">
  <text x="28" y="40" class="mono" font-size="12" fill="#7D8AA0">02</text>
  <rect x="56" y="25" width="119.0" height="21" rx="10.5" fill="#A78BFA" fill-opacity=".1" stroke="#A78BFA" stroke-opacity=".45"/>
  <text x="115.5" y="39.5" text-anchor="middle" class="mono" font-size="11" letter-spacing=".5" fill="#A78BFA">VOICE AI · LIVE</text>
  <text x="552" y="44" text-anchor="end" class="mono" font-size="20" fill="#A78BFA">↗</text>
  <text x="28" y="86" class="sans" font-size="27" font-weight="800" letter-spacing="-.5" fill="#E6EDF3">Hey Dude</text>
  <text x="28" y="114" class="sans" font-size="14.5" fill="#7D8AA0">Voice assistant with face-auth login, Gemini reasoning,</text><text x="28" y="134" class="sans" font-size="14.5" fill="#7D8AA0">WhatsApp automation and full system control.</text>
</g>
<g class="rise" style="animation-delay:0.20s"><text x="28" y="168" class="sans" font-size="14.5" fill="#E6EDF3"><tspan fill="#A78BFA" class="mono">▸ </tspan>Shipped zero → production in 15 days</text><text x="28" y="192" class="sans" font-size="14.5" fill="#E6EDF3"><tspan fill="#A78BFA" class="mono">▸ </tspan>&lt;500 ms hotword latency · &lt;2 s face login</text></g>
<g class="rise" style="animation-delay:0.35s"><rect x="28" y="214" width="65.2" height="26" rx="13.0" fill="#A78BFA" fill-opacity=".08" stroke="#A78BFA" stroke-opacity=".38"/><text x="60.6" y="231.3" text-anchor="middle" class="mono" font-size="12" fill="#A78BFA">Python</text><rect x="101.19999999999999" y="214" width="65.2" height="26" rx="13.0" fill="#A78BFA" fill-opacity=".08" stroke="#A78BFA" stroke-opacity=".38"/><text x="133.8" y="231.3" text-anchor="middle" class="mono" font-size="12" fill="#A78BFA">Gemini</text><rect x="174.39999999999998" y="214" width="65.2" height="26" rx="13.0" fill="#A78BFA" fill-opacity=".08" stroke="#A78BFA" stroke-opacity=".38"/><text x="207.0" y="231.3" text-anchor="middle" class="mono" font-size="12" fill="#A78BFA">OpenCV</text><rect x="247.59999999999997" y="214" width="65.2" height="26" rx="13.0" fill="#A78BFA" fill-opacity=".08" stroke="#A78BFA" stroke-opacity=".38"/><text x="280.2" y="231.3" text-anchor="middle" class="mono" font-size="12" fill="#A78BFA">SQLite</text></g>

</svg>
