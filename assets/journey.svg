  <text x="600.0" y="224" text-anchor="middle" class="sans" font-size="15.5" font-weight="700" fill="#E6EDF3">VibeHub</text>
  <text x="600.0" y="243" text-anchor="middle" class="sans" font-size="12.5" fill="#7D8AA0">Summer of Codefest &#x27;25</text>
</g><g class="rise" style="animation-delay:1.50s">
  <line x1="758.3" y1="136" x2="758.3" y2="124" stroke="#FBBF24" stroke-opacity=".5" stroke-dasharray="2 3"/>
