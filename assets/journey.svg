<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Build journey">
<title>Build journey</title>
<style>
  .sans { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace; }
  .rise { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
  .fade { animation: fade .6s ease-out both; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .ping { animation: ping 2s cubic-bezier(0,0,.2,1) infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 0%,100% { opacity: .45; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }
  @keyframes ping { 0% { opacity: .7; transform: scale(1); } 80%,100% { opacity: 0; transform: scale(2.6); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .draw { stroke-dasharray: 1100; stroke-dashoffset: 1100; animation: draw 2.2s cubic-bezier(.4,0,.2,1) .2s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { .draw { stroke-dashoffset: 0; } }
</style>
<defs><linearGradient id="tl" x1="0" x2="1"><stop offset="0" stop-color="#5EEAD4"/><stop offset=".5" stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<clipPath id="c"><rect width="1200" height="300" rx="16"/></clipPath></defs>

<g clip-path="url(#c)"><rect width="1200" height="300" fill="#070B14"/></g>
<rect x=".5" y=".5" width="1199" height="299" rx="15.5" fill="none" stroke="#1C2638"/>
<line x1="85" y1="150" x2="1115" y2="150" stroke="#1C2638" stroke-width="2"/>
<line x1="85" y1="150" x2="1115" y2="150" stroke="url(#tl)" stroke-width="2" class="draw"/>
