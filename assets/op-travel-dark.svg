<svg xmlns="http://www.w3.org/2000/svg" width="592" height="290" viewBox="0 0 592 290" role="img" aria-label="Hey, where next? — Ai Travel Assist"><title>Hey, where next? — Ai Travel Assist</title><style>
  .sans { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
  .cond { font-family: Bahnschrift, 'DIN Condensed', 'Arial Narrow', 'Roboto Condensed', 'Segoe UI', sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Consolas, 'Courier New', monospace; }
  .serif { font-family: Georgia, 'Times New Roman', serif; }
  .rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
  .redact { animation: unredact .7s cubic-bezier(.7,0,.3,1) both; transform-box: fill-box; transform-origin: right; }
  .stamp { animation: stamp .5s cubic-bezier(.2,.8,.2,1.3) both; transform-box: fill-box; transform-origin: center; }
  .blink { animation: blink 1.2s steps(1) infinite; }
  .ping { animation: ping 2s cubic-bezier(0,0,.2,1) infinite; transform-box: fill-box; transform-origin: center; }
  .drift { animation: drift 16s ease-in-out infinite; }
  @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(30px,-16px); } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes unredact { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  @keyframes stamp { from { opacity: 0; transform: scale(1.8); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes ping { 0% { opacity: .8; transform: scale(1); } 80%,100% { opacity: 0; transform: scale(2.8); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .redact { display: none; } }

  .eq { animation: eq 1.1s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes eq { from { transform: scaleY(.18); } to { transform: scaleY(1); } }
  .sweep { animation: sweep 3s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(0); } 100% { transform: translateX(160px); } }
</style><defs><clipPath id="sheet"><rect width="592" height="290" rx="14"/></clipPath><linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050817"/><stop offset=".55" stop-color="#050817"/><stop offset="1" stop-color="#111044"/></linearGradient><radialGradient id="gR"><stop offset="0" stop-color="#8B102B" stop-opacity=".45"/><stop offset="1" stop-color="#8B102B" stop-opacity="0"/></radialGradient><radialGradient id="gB"><stop offset="0" stop-color="#5145FF" stop-opacity=".40"/><stop offset="1" stop-color="#5145FF" stop-opacity="0"/></radialGradient><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E4E9FF" stroke-opacity=".05"/></pattern></defs>

<g clip-path="url(#sheet)">
