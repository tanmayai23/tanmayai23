<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="56" viewBox="0 0 1200 56" role="img" aria-label="Impact">
<title>Impact</title>
<style>
  .sans { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace; }
  .rise { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
  .fade { animation: fade .6s ease-out both; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .ping { animation: ping 2s cubic-bezier(0,0,.2,1) infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 0%,100% { opacity: .45; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }
  @keyframes ping { 0% { opacity: .7; transform: scale(1); } 80%,100% { opacity: 0; transform: scale(2.6); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .scan { animation: scan 6s ease-in-out infinite; }
  @keyframes scan { 0%,100% { transform: translateX(0); } 50% { transform: translateX(1040px); } }
</style>
<defs><linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#5EEAD4" stop-opacity="0"/><stop offset=".5" stop-color="#5EEAD4"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect width="1200" height="56" rx="12"/></clipPath></defs>

<g clip-path="url(#c)">
  <rect width="1200" height="56" fill="#0C1220"/>
  <rect x="20" y="54" width="120" height="2" fill="url(#hl)" class="scan"/>
</g>
<rect x=".5" y=".5" width="1199" height="55" rx="11.5" fill="none" stroke="#1C2638"/>
<text x="26" y="34" class="mono" font-size="14" fill="#5EEAD4">02</text>
<text x="62" y="35" class="sans" font-size="17" font-weight="700" letter-spacing="3" fill="#E6EDF3">IMPACT</text>
<text x="1174" y="34" text-anchor="end" class="mono" font-size="13" fill="#7D8AA0">// numbers, not adjectives</text>

</svg>
