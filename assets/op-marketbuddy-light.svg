<svg xmlns="http://www.w3.org/2000/svg" width="592" height="290" viewBox="0 0 592 290" role="img" aria-label="Market Buddy — Autonomous Voice Agent · Call-E"><title>Market Buddy — Autonomous Voice Agent · Call-E</title><style>
