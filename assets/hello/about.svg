<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="About: I build AI that leaves the demo stage. Building AI products, exploring RAG and evaluation, leading NAXATRA AI, open to AI/ML internships."><title>About: I build AI that leaves the demo stage. Building AI products, exploring RAG and evaluation, leading NAXATRA AI, open to AI/ML internships.</title><style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Google Sans', 'Segoe UI Variable Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, 'Roboto Mono', monospace; }
  .up { animation: up .9s cubic-bezier(.2,.8,.2,1) both; }
  .fade { animation: fade 1.2s ease both; }
  .twinkle { animation: twinkle 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .spin { animation: spin 14s linear infinite; transform-box: fill-box; transform-origin: center; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  .drop { animation: drop 3.6s cubic-bezier(.55,0,.9,.5) infinite; transform-box: fill-box; transform-origin: center top; }
  .breathe { animation: breathe 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center top; }
  .zoom { animation: zoom 18s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  .ripple { animation: ripple 3.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes twinkle { 0%,100% { opacity: .25; transform: scale(.55) rotate(0deg); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes drop { 0%,30% { opacity: 0; transform: translateY(0) scale(.4); } 40% { opacity: 1; transform: translateY(0) scale(1); }
                     85% { opacity: 1; transform: translateY(70px) scale(1,1.15); } 100% { opacity: 0; transform: translateY(84px) scale(1.2,.6); } }
  @keyframes breathe { 0%,100% { transform: scaleY(1); } 40% { transform: scaleY(1.07); } }
  @keyframes zoom { from { transform: scale(1); } to { transform: scale(1.07); } }
  @keyframes ripple { 0% { opacity: .7; transform: scale(.2); } 100% { opacity: 0; transform: scale(1.6); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style><defs></defs>
<rect x="16" y="10" width="1168" height="380" rx="30" fill="#F5F5F7"/>
<g class="up" style="animation-delay:0.05s">
  <text x="88" y="84" class="mono" font-size="14" letter-spacing="2" fill="#6E6E73">ABOUT</text>
  <text x="86" y="146" font-size="44" font-weight="700" letter-spacing="-1.4" fill="#1D1D1F">I build AI that</text>
  <text x="86" y="200" font-size="44" font-weight="700" letter-spacing="-1.4" fill="#1D1D1F">leaves the <tspan fill="#4285F4">demo stage.</tspan></text>
</g>
<g class="up" style="animation-delay:0.20s">
  <text x="88" y="256" font-size="17" fill="#424245">Turning models, data and APIs into tools people actually use —</text>
  <text x="88" y="282" font-size="17" fill="#424245">shipped, measured, and improved after the first deploy.</text>
  <text x="88" y="338" font-size="15" font-style="italic" fill="#6E6E73">“Ideas are cheap. Useful systems are the work.”</text>
</g>
<line x1="626" y1="70" x2="626" y2="330" stroke="#E3E3E8" stroke-width="1.5"/>
<text x="666" y="84" class="mono up" font-size="14" letter-spacing="2" fill="#6E6E73" style="animation-delay:0.30s">RIGHT NOW</text>
<g class="up" style="animation-delay:0.35s"><circle cx="672" cy="110" r="6" fill="#4285F4"/><text x="692" y="116" font-size="17" font-weight="700" fill="#1D1D1F">Building</text><text x="692" y="140" font-size="15.5" fill="#6E6E73">AI products, LLM workflows and voice interfaces</text></g><g class="up" style="animation-delay:0.47s"><circle cx="672" cy="172" r="6" fill="#EA4335"/><text x="692" y="178" font-size="17" font-weight="700" fill="#1D1D1F">Exploring</text><text x="692" y="202" font-size="15.5" fill="#6E6E73">RAG, evaluation, fine-tuning and production NLP</text></g><g class="up" style="animation-delay:0.59s"><circle cx="672" cy="234" r="6" fill="#FBBC04"/><text x="692" y="240" font-size="17" font-weight="700" fill="#1D1D1F">Leading</text><text x="692" y="264" font-size="15.5" fill="#6E6E73">NAXATRA AI — useful AI infrastructure for Bharat</text></g><g class="up" style="animation-delay:0.71s"><circle cx="672" cy="296" r="6" fill="#34A853"/><text x="692" y="302" font-size="17" font-weight="700" fill="#1D1D1F">Open to</text><text x="692" y="326" font-size="15.5" fill="#6E6E73">AI/ML &amp; GenAI internships and ambitious collaborators</text></g>
