<svg xmlns="http://www.w3.org/2000/svg" width="590" height="340" viewBox="0 0 590 340" role="img" aria-label="Market Buddy — Autonomous voice agent · CALL-E · 421 passing tests"><title>Market Buddy — Autonomous voice agent · CALL-E · 421 passing tests</title><style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Google Sans', 'Segoe UI Variable Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, 'Roboto Mono', monospace; }
