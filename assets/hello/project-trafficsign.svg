<svg xmlns="http://www.w3.org/2000/svg" width="590" height="340" viewBox="0 0 590 340" role="img" aria-label="TrafficSignNet — 43-class CNN from scratch · 96.82% accuracy"><title>TrafficSignNet — 43-class CNN from scratch · 96.82% accuracy</title><style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Google Sans', 'Segoe UI Variable Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; }
