<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="SwachhVan — AI smart-sanitation platform. Top 25 of 400+ teams, −60% dispatch planning, 100+ simulated bookings"><title>SwachhVan — AI smart-sanitation platform. Top 25 of 400+ teams, −60% dispatch planning, 100+ simulated bookings</title><style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Google Sans', 'Segoe UI Variable Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; }
