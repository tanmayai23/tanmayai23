# Redraws the contribution-grid snake in Google colours every 12 hours
# and publishes it to the `output` branch, which the README reads from.
name: contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#4285F4&color_dots=#EBEDF0,#D2E3FC,#8AB4F8,#4285F4,#1A73E8
            dist/snake-dark.svg?palette=github-dark&color_snake=#8AB4F8&color_dots=#161B22,#1A3A6B,#2A5DB0,#4285F4,#8AB4F8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
